<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Andrés Caviedes. Tecnología educativa, automatización y accesibilidad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101F30"/>
      <stop offset="0.55" stop-color="#17465B"/>
      <stop offset="1" stop-color="#247A87"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- Red de nodos: plataformas, datos y personas -->
  <g stroke="#9FE3E8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M820 80 L930 130 L1060 85 M930 130 L900 220 L1040 210 L1060 85 M1040 210 L1120 150 L1060 85 M900 220 L800 190 L820 80"/>
  </g>
  <g fill="#9FE3E8">
    <circle cx="820" cy="80" r="6" fill-opacity="0.7"/>
    <circle cx="930" cy="130" r="9" fill-opacity="0.9"/>
    <circle cx="1060" cy="85" r="7" fill-opacity="0.7"/>
    <circle cx="900" cy="220" r="6" fill-opacity="0.6"/>
    <circle cx="1040" cy="210" r="8" fill-opacity="0.8"/>
    <circle cx="1120" cy="150" r="5" fill-opacity="0.6"/>
    <circle cx="800" cy="190" r="4" fill-opacity="0.5"/>
  </g>
  <circle cx="930" cy="130" r="20" fill="none" stroke="#9FE3E8" stroke-opacity="0.3" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="92" fill="#9FE3E8" font-size="15" font-weight="600" letter-spacing="3">INGENIERÍA DE SISTEMAS</text>
    <text x="70" y="160" fill="#FFFFFF" font-size="58" font-weight="700">Andrés Caviedes</text>
    <rect x="72" y="182" width="64" height="4" rx="2" fill="#9FE3E8"/>
    <text x="72" y="226" fill="#DCEFF1" font-size="22">Tecnología educativa · Automatización · Accesibilidad</text>
  </g>
</svg>
